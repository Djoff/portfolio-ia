# Vérifie chaque modification : fichiers projets valides, site construit, tests verts.
name: Vérifier le site

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.168.0"
  # Empreinte officielle de hugo_0.168.0_linux-amd64.tar.gz (fichier checksums de la version).
  HUGO_SHA256: "fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594"

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Hugo (version figée, empreinte vérifiée)
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lancer les tests
        run: |
          hugo version
          bash tests/run.sh
