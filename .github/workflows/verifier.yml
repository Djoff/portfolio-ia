# Vérifie chaque modification : fichiers projets valides, site construit, tests verts.
name: Vérifier le site

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.168.0"
  # Empreinte officielle de hugo_0.168.0_linux-amd64.tar.gz (fichier checksums de la version).
  HUGO_SHA256: "fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594"

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Hugo (version figée, empreinte vérifiée)
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lancer les tests
        env:
          # Mots interdits (noms de clients, identifiants internes), séparés par des virgules.
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          hugo version
          bash tests/run.sh

  # Publication : après des tests verts sur main, le site généré est déposé sur la branche
  # « site ». Hostinger tire cette branche (liaison Git de hPanel, déclenchée par webhook).
  publier:
    needs: verifier
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Une publication à la fois, sans en interrompre une en cours.
    concurrency:
      group: publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BRANCHE_SITE: site
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Hugo (version figée, empreinte vérifiée)
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Générer le site
        run: |
          hugo --panicOnWarning --destination "$RUNNER_TEMP/site"
          # Garde-fou : la page d'accueil et les en-têtes de sécurité doivent être présents.
          test -f "$RUNNER_TEMP/site/fr/index.html"
          test -f "$RUNNER_TEMP/site/en/index.html"
          test -f "$RUNNER_TEMP/site/.htaccess"

      - name: Déposer le site sur la branche « site »
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git_auth() { git -c http.extraheader="AUTHORIZATION: basic ${auth}" "$@"; }
          distant="https://github.com/${GITHUB_REPOSITORY}.git"
          depot="$RUNNER_TEMP/depot-site"

          # On repart de la branche existante, pour que Hostinger puisse simplement la tirer.
          if git_auth ls-remote --exit-code --heads "$distant" "$BRANCHE_SITE" >/dev/null; then
            git_auth clone -q --depth 1 --branch "$BRANCHE_SITE" "$distant" "$depot"
          else
            git init -q -b "$BRANCHE_SITE" "$depot"
          fi
          find "$depot" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/site/." "$depot/"

          cd "$depot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site inchangé : rien à publier."
            exit 0
          fi
          git commit -q -m "Publication de ${GITHUB_SHA::7}"
          git_auth push "$distant" "HEAD:refs/heads/${BRANCHE_SITE}"
