{{- /* Légende des types d'étapes, affichée une seule fois au-dessus des tuiles. */ -}}
<div class="legende">
  <p class="legende__titre">{{ T "legende_titre" }}</p>
  <ul class="legende__liste">
    <li><span class="etape etape--ia">{{ T "legende_ia" }}</span></li>
    <li><span class="etape etape--controle">✓ {{ T "legende_controle" }}</span></li>
    <li><span class="etape etape--normal">{{ T "legende_normal" }}</span></li>
  </ul>
  {{- if not site.Params.filtre }}
  {{ partial "langue.html" . }}
  {{- end }}
</div>
